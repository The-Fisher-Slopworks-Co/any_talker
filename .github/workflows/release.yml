# What a merged main gets: the same gate a PR ran, then the image, then the
# deploy webhook. `main` is unprotected, so the gate here is what actually keeps
# a red commit from shipping — a green PR check alone doesn't block anything.
name: Release

on:
  push:
    branches: [main]

# Serialized per branch, and never cancelled: killing a run mid-flight could
# leave the image published with the webhook unfired.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  docker:
    name: Build & publish Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate commit SHA
        run: |
          if [ -z "${{ github.sha }}" ]; then
            echo "github.sha is empty; refusing to build with an empty GIT_COMMIT label" >&2
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    name: Trigger deploy webhook
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --max-time 30 \
            "$DEPLOY_WEBHOOK_URL"
