# The `bun run check` gate minus REUSE (reuse.yml runs that on its own),
# defined once and called by both CI (pull requests) and Release (pushes to
# main). It exists as its own workflow rather than a job
# in each caller because a job whose `if:` excludes the current event is still
# created — as a skipped check cluttering every PR. Splitting the triggers per
# file is the only way to keep the Docker publish jobs off pull requests.
#
# Called with a local path, so it always runs the copy from the caller's own
# commit — a PR is gated by its own version of this file.
name: Check

on: workflow_call

permissions:
  contents: read

jobs:
  check:
    name: Type check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same steps as `bun run check` and the lefthook pre-commit hook, so a
      # commit made with `LEFTHOOK=0` cannot reach main unchecked. One step per
      # tool keeps the failing one visible in the run summary. The job keeps
      # its old name so required status checks still match.
      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Unused code
        run: bun run knip

      - name: Run tests
        run: bun run test
