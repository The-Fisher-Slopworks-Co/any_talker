version: 2
updates:
  # The actions our CI / release / REUSE workflows pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The runtime and dev dependencies. Bun's ecosystem reads package.json +
  # bun.lock; everything lands in one PR a week, majors included, so the whole
  # week's drift gets read and merged in a single pass.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      dependencies:
        patterns:
          - "*"
