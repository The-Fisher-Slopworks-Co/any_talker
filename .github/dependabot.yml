version: 2
updates:
  # The actions our CI / release / REUSE workflows pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The runtime and dev dependencies. Bun's ecosystem reads package.json +
  # bun.lock; grouping the non-major bumps keeps this to one PR a week, while
  # majors stay separate because they are the ones that need reading.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
